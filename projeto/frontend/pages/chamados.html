<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Chamados - Sistema de Chamados</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="topo">
    <h1>Chamados Técnicos</h1>
    <nav>
      <span id="nome-usuario"></span>
      <a href="dashboard.html">Dashboard</a>
      <button id="btn-sair">Sair</button>
    </nav>
  </header>

  <main>
    <section class="card">
      <h2>Novo Chamado</h2>
      <form id="form-chamado">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" required>

        <label for="descricao">Descrição</label>
        <textarea id="descricao" required></textarea>

        <label for="categoria">Categoria</label>
        <input type="text" id="categoria" required>

        <label for="prioridade">Prioridade</label>
        <select id="prioridade" required>
          <option value="">Selecione</option>
          <option value="baixa">Baixa</option>
          <option value="média">Média</option>
          <option value="alta">Alta</option>
        </select>

        <label for="usuario_id">Usuário responsável</label>
        <select id="usuario_id" required></select>

        <p id="mensagem-erro-chamado" class="erro"></p>

        <button type="submit">Cadastrar</button>
      </form>
    </section>

    <section class="card" style="max-width: 100%;">
      <h2>Chamados cadastrados</h2>

      <div class="filtros">
        <label for="filtro-status">Status:</label>
        <select id="filtro-status">
          <option value="">Todos</option>
          <option value="aberto">Aberto</option>
          <option value="em andamento">Em andamento</option>
          <option value="concluído">Concluído</option>
        </select>

        <label for="filtro-prioridade">Prioridade:</label>
        <select id="filtro-prioridade">
          <option value="">Todas</option>
          <option value="baixa">Baixa</option>
          <option value="média">Média</option>
          <option value="alta">Alta</option>
        </select>
      </div>

      <table id="tabela-chamados">
        <thead>
          <tr>
            <th>ID</th><th>Título</th><th>Categoria</th><th>Prioridade</th>
            <th>Status</th><th>Responsável</th><th>Criado em</th><th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/chamados.js"></script>
</body>
</html>
